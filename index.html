<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gdańsk 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: hanseatisk byside – mursten, rav og Østersø. Forside med fliser, én sektion ad gangen. */
:root{
  color-scheme:light;
  --bg:#f1f2ef; --surface:#ffffff; --surface-2:#e7e8e3; --ink:#1e2a30; --muted:#59646a; --line:#d9dbd4;
  --brick:#9b2d20; --brick-ink:#ffffff; --amber:#b9770e; --amber-bg:#f8ecd3; --baltic:#1f4a5c;
  --ok:#2f7a4d; --ok-bg:#e1f1e6; --warn:#8a6100; --warn-bg:#f8eccd; --bad:#a3392a; --bad-bg:#f7e0db;
  --water:#c9dde6; --landfill:#eceee8; --street:#c9b28a; --block:#dfe0d8; --road:#ffffff; --road-major:#f3dca8; --square:#e9e1cc;
  --shadow:0 1px 2px rgba(30,42,48,.06),0 6px 20px rgba(30,42,48,.06);
  --night:#13233a; --night-2:#2a4767; --snow:#ffffff; --pine:#1f5c3f; --pine-bg:#e2efe6;
  --f-display:Alegreya,Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a1d; --surface:#1b2327; --surface-2:#232d32; --ink:#eceae5; --muted:#a2acb0; --line:#2f3b41;
    --brick:#e0705c; --brick-ink:#1a0d0a; --amber:#e8b04f; --amber-bg:#3a2c12; --baltic:#7fb8cf;
    --ok:#7dd3a0; --ok-bg:#173327; --warn:#f0c35a; --warn-bg:#3a2f12; --bad:#f19a8a; --bad-bg:#3d1f1a;
    --water:#24556d; --landfill:#1f282c; --street:#8a7347; --block:#283238; --road:#3a464c; --road-major:#5c4c2c; --square:#30342d; --night:#0b1626; --night-2:#1c3550; --pine:#7cc79d; --pine-bg:#183326; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a1d; --surface:#1b2327; --surface-2:#232d32; --ink:#eceae5; --muted:#a2acb0; --line:#2f3b41;
  --brick:#e0705c; --brick-ink:#1a0d0a; --amber:#e8b04f; --amber-bg:#3a2c12; --baltic:#7fb8cf;
  --ok:#7dd3a0; --ok-bg:#173327; --warn:#f0c35a; --warn-bg:#3a2f12; --bad:#f19a8a; --bad-bg:#3d1f1a;
  --water:#24556d; --landfill:#1f282c; --street:#8a7347; --block:#283238; --road:#3a464c; --road-major:#5c4c2c; --square:#30342d; --night:#0b1626; --night-2:#1c3550; --pine:#7cc79d; --pine-bg:#183326; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--baltic)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px}
header.top{background:linear-gradient(180deg,var(--night),var(--night-2));color:#fff;position:relative;overflow:hidden}
header.top::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.85;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90px 80px,#fff 50%,transparent 51%),radial-gradient(2.5px 2.5px at 150px 20px,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 210px 110px,#fff 50%,transparent 51%),radial-gradient(2px 2px at 260px 60px,#fff 50%,transparent 51%);
  background-size:280px 140px;animation:snowdrift 14s linear infinite}
@keyframes snowdrift{from{background-position:0 0}to{background-position:-60px 140px}}
.lights{position:absolute;left:0;right:0;top:0;height:34px;width:100%;pointer-events:none}
.lights circle{animation:twinkle 2.4s ease-in-out infinite}
.lights circle:nth-child(3n){animation-delay:.8s}.lights circle:nth-child(3n+1){animation-delay:1.6s}
@keyframes twinkle{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){header.top::before,.lights circle,.flake{animation:none!important}}
.postcard{margin:20px 0 0;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:#13233a}
.postcard svg{display:block;width:100%;height:auto}
.postcard figcaption{background:var(--surface);color:var(--muted);font-size:14px;padding:8px 14px;border-top:1px solid var(--line)}
.flake{animation:fall2 linear infinite}
@keyframes fall2{from{transform:translateY(-40px)}to{transform:translateY(640px)}}
.photo{margin:20px auto 6px;max-width:560px;background:#fff;padding:10px 10px 6px;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.15);transform:rotate(-1.5deg)}
.photo img{display:block;width:100%;height:auto;border-radius:2px}
.restophotos{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;margin:10px auto 0}
.restophotos .photo{margin:8px 0 4px}
.restophotos .photo img{aspect-ratio:4/3;object-fit:cover}
.restophotos .photo figcaption{font-size:15px}
.giftcard .credit{font-size:12px;color:var(--muted);margin:2px 0 0;text-align:center}
@media(max-width:520px){.restophotos{gap:10px}.restophotos .photo{padding:6px 6px 4px}.restophotos .photo figcaption{font-size:13px}}
.photo figcaption{font:italic 500 17px var(--f-display);color:#3a3a3a;padding:6px 0 2px}
header.top .wrap{position:relative;z-index:1;padding-block:34px 64px}
.brand{display:inline-flex;flex-direction:column;text-decoration:none;color:inherit}
.brand h1{font-size:34px;font-weight:800;letter-spacing:.01em}
.brand small{opacity:.95;font-size:15px;color:#f3d48a}
.skyline{position:absolute;left:0;right:0;bottom:-1px;height:70px;width:100%;color:var(--bg)}
.hero{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;flex:1 1 150px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.greet{margin:18px 0 0;padding:18px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.greet h2{font-size:24px;margin-bottom:6px}
.greet p{margin:0;max-width:68ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:18px 0 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
button.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
button.tile:hover,button.tile:focus-visible{transform:translateY(-2px);border-color:var(--brick)}
button.tile:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.tile .ic{width:40px;height:40px;border-radius:10px;background:var(--pine-bg);display:grid;place-items:center;color:var(--pine)}
.tile h3{font-size:23px}
.tile p{margin:0;color:var(--muted);font-size:15px}
.tile .go{margin-top:auto;font-weight:700;color:var(--brick);font-size:15px}
button.tile.gift{grid-column:1/-1;flex-direction:row;align-items:center;gap:18px;background:var(--amber-bg);border-color:var(--amber)}
.tile.gift .ic{width:64px;height:64px;border-radius:14px;background:var(--amber);color:var(--surface);flex:none}
.tile.gift h3{font-size:28px}
.tile.gift .go{margin:0 0 0 auto;white-space:nowrap}
@media (max-width:560px){button.tile.gift{flex-wrap:wrap}.tile.gift .go{margin:0}}
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 6px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 15px;cursor:pointer}
.btn:hover{border-color:var(--brick)}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn.primary{background:var(--brick);color:var(--brick-ink);border-color:var(--brick)}
.sec-title{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.sec-title h2{font-size:36px}
.lead{color:var(--muted);margin:0 0 18px;max-width:66ch;font-size:18px}
.stack{display:flex;flex-direction:column;gap:14px;margin-bottom:24px}
h3.sub{font-size:24px;margin:30px 0 12px}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-n{background:var(--surface-2);color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item h4{margin:0;font-size:21px}
.item p{margin:8px 0 0;max-width:72ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:15px;color:var(--muted)}
.meta b{color:var(--ink)}
.rec{border-color:var(--amber)}
.tag-rec{color:var(--amber);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{font:inherit;font-size:15px;font-weight:500;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:15px}
.note{font-size:15px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:11px 14px;margin:0 0 16px}
details{margin-top:10px}summary{cursor:pointer;color:var(--baltic);font-weight:700;font-size:15px}details p{margin:8px 0 0}
.todo{color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:0 6px;font-weight:500}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:12px 0 0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
@media (max-width:480px){dl.kv{grid-template-columns:1fr;gap:0}dl.kv dd{margin-bottom:8px}}
/* historie */
.timeline{display:flex;flex-direction:column;gap:0;margin:8px 0 24px;border-left:3px solid var(--line);padding-left:22px}
.chap{position:relative;padding:4px 0 26px;scroll-margin-top:16px}
.chap::before{content:"";position:absolute;left:-31px;top:10px;width:15px;height:15px;border-radius:50%;background:var(--brick);border:3px solid var(--bg)}
.chap .yr{font-family:var(--f-display);font-weight:800;color:var(--brick);font-size:18px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.chap h3{font-size:27px;margin:2px 0 8px}
.chap p{margin:0 0 10px;max-width:68ch}
.chap .see{font-size:15px;color:var(--muted)}
.chap .see button{font:inherit;color:var(--baltic);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;font-weight:700}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:28px}
.boxes ul{margin:8px 0 0;padding-left:18px}.boxes li{margin-bottom:8px}
/* kort */
.mapwrap{background:var(--landfill);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;margin:0 auto}
.land{fill:var(--landfill)}
.river{fill:none;stroke:var(--water);stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
.river.small{stroke-width:12}
.block{fill:var(--block)} .square{fill:var(--square)}
.road{fill:none;stroke:var(--road);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.road.major{stroke:var(--road-major);stroke-width:11}
.road.bridge{stroke:var(--road);stroke-width:6}
.street{fill:none;stroke:var(--brick);stroke-width:5;stroke-linecap:round;stroke-dasharray:2 10;opacity:.75}
.rlbl{fill:var(--muted);font:500 11.5px var(--f-body);letter-spacing:.02em}
.area{fill:var(--muted);font:italic 600 15px var(--f-display);opacity:.8}
.scale{stroke:var(--ink);stroke-width:2;fill:none} .scale-t{fill:var(--ink);font:600 12px var(--f-body)}
.lbl{fill:var(--muted);font:italic 500 17px var(--f-display)}
.lbl.river-l{fill:var(--baltic)}
.ref circle{fill:var(--muted)}
.pin{cursor:pointer}
.pin circle{stroke:var(--surface);stroke-width:3.5;fill:var(--brick)}
.pin text{fill:var(--brick-ink);font:700 16px var(--f-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.hotel circle{fill:var(--baltic)} .pin.hotel text{fill:var(--surface)}
.pin.sel circle{stroke:var(--amber);stroke-width:6}
.pin:focus{outline:none} .pin:focus-visible circle{stroke:var(--amber);stroke-width:6}
.mapgrid{display:grid;gap:16px;align-items:start}
.mapcol{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:8px 4px}
.placelist{display:flex;flex-direction:column;gap:6px;min-width:0}
.place{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.place:hover{border-color:var(--brick)}
.place:focus-visible{outline:3px solid var(--amber)}
.place h4{margin:0;font-size:18px}
.place .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--brick-ink);background:var(--brick);font-weight:700;font-size:14px}
.place .no.hotel{background:var(--baltic);color:var(--surface)}
.place .acts{font-size:15px;color:var(--muted);margin-top:2px}
.place .more{font-size:15px;margin-top:8px}
.place.sel{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.maplink{font:inherit;font-size:15px;font-weight:700;color:var(--baltic);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
@media (max-width:859px){.mapcol{position:static}.place{scroll-margin-top:16px}}
@media (min-width:860px){.mapgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}.mapcol{top:calc(env(safe-area-inset-top,0px) + 12px)}.place{scroll-margin-top:16px}}
/* program */
.day{display:grid;grid-template-columns:110px 1fr;gap:14px}
.day .d{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--brick)}
.day ul{margin:0;padding-left:18px}
/* gave */
.giftcard{border:2px solid var(--amber);background:var(--amber-bg);border-radius:18px;padding:26px 22px;text-align:center}
.giftcard h3{font-size:34px;color:var(--brick);margin-bottom:10px}
.giftcard p{max-width:56ch;margin:0 auto 12px}
.giftcard.locked{border-style:dashed;background:var(--surface)}
.giftcard .lock{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--amber-bg);color:var(--amber)}
.giftcard .resto{margin:20px auto 6px;max-width:520px;background:var(--surface);border-radius:14px;padding:18px;text-align:left;border:1px solid var(--line)}
.giftcard .resto h4{font-size:26px;text-align:center;margin-bottom:4px}
.flagrow{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
#party{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.95);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;color:#fff}
#party canvas{position:absolute;inset:0;width:100%;height:100%}
#party .msg{position:relative;text-align:center;padding:24px 16px;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
#party .msg h2{font-size:clamp(38px,9vw,78px);color:#ffd166;text-shadow:0 2px 20px rgba(0,0,0,.5)}
#party .msg p{font-size:20px;margin:10px 0 18px;color:#fff}
#party .msg .btn{background:#ffd166;color:#2a1b00;border-color:#ffd166;font-size:18px;padding:12px 22px}
#party .flag{position:absolute;top:-60px;width:44px;height:33px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 120px)) rotate(var(--r))}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#party .flag{display:none}#party .msg{animation:none}}
.pager{display:flex;justify-content:space-between;gap:10px;margin:14px 0 48px;flex-wrap:wrap}
footer{color:var(--muted);font-size:14px;padding-block:20px 40px}
@media (max-width:560px){body{font-size:16.5px}.day{grid-template-columns:1fr;gap:4px}.sec-title h2{font-size:30px}.brand h1{font-size:29px}}
</style>
</head>

  <svg class="lights" viewBox="0 0 1000 34" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <path d="M0 4 Q125 30 250 4 T500 4 T750 4 T1000 4" fill="none" stroke="#0e1a2a" stroke-width="1.5"/>

  </svg>
</header>

<main class="wrap" id="app"></main>
<footer class="wrap" id="foot"></footer>

<script>

/* Julekort: Ove og Eva på Langtorvet (tegnet, med deres ansigter) */
function postcard(){
  const W=1000, H=600, G=470;
  let seed=7; const r=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const cols=["#e9c46a","#d98f6a","#c9dbc8","#efe0bd","#9fb8c8","#d6a2a2","#f3e6c8","#b5c99a","#e3b38a"];
  let houses="", x=-20, i=0;
  while(x<W+20){
    const w=72+r()*46, h=190+r()*120, top=G-h, ph=34+r()*30, c=cols[i++%cols.length];
    const stepped = r()<.5;
    const roof = stepped
      ? `M${x},${top} h${w*.15} v-${ph*.35} h${w*.15} v-${ph*.35} h${w*.4} v${ph*.35} h${w*.15} v${ph*.35} h${w*.15}`
      : `M${x},${top} Q${x+w*.08},${top-ph*.5} ${x+w*.3},${top-ph*.6} L${x+w/2},${top-ph} L${x+w*.7},${top-ph*.6} Q${x+w*.92},${top-ph*.5} ${x+w},${top}`;
    houses += `<path d="M${x},${G} V${top} ${roof.slice(roof.indexOf(" "))} V${G} Z" fill="${c}" stroke="#2b2b33" stroke-opacity=".25"/>`;
    for(let y=top+18; y<G-40; y+=36){ for(let k=0;k<3;k++){ const wx=x+w*(.18+k*.27);
      houses += `<rect x="${wx.toFixed(1)}" y="${y.toFixed(1)}" width="12" height="19" rx="2" fill="${r()<.62?"#ffd77a":"#3b4250"}"/>`; } }
    x+=w;
  }
  const stars = Array.from({length:40},()=>`<circle cx="${(r()*W).toFixed(0)}" cy="${(r()*150).toFixed(0)}" r="${(0.6+r()*1.4).toFixed(1)}" fill="#fff" opacity="${(.4+r()*.6).toFixed(2)}"/>`).join("");
  const flakes = Array.from({length:70},()=>`<circle class="flake" cx="${(r()*W).toFixed(0)}" cy="${(-r()*600).toFixed(0)}" r="${(1.5+r()*2.5).toFixed(1)}" fill="#fff" opacity=".85" style="animation-duration:${(7+r()*8).toFixed(1)}s;animation-delay:-${(r()*12).toFixed(1)}s"/>`).join("");

      <ellipse cx="${cx-16}" cy="${f}" rx="16" ry="7" fill="#1d2027"/><ellipse cx="${cx+16}" cy="${f}" rx="16" ry="7" fill="#1d2027"/>
      <path d="M${cx-48},${f-190} Q${cx},${f-212} ${cx+48},${f-190} L${cx+60},${f-70} Q${cx},${f-58} ${cx-60},${f-70} Z" fill="${coat}"/>
      <path d="M${cx-48},${f-186} Q${cx-74},${f-150} ${cx-66},${f-104}" stroke="${coat}" stroke-width="22" stroke-linecap="round" fill="none"/>
      <path d="M${cx+48},${f-186} Q${cx+74},${f-150} ${cx+66},${f-104}" stroke="${coat}" stroke-width="22" stroke-linecap="round" fill="none"/>
      <circle cx="${cx-66}" cy="${f-100}" r="11" fill="#c94f4f"/><circle cx="${cx+66}" cy="${f-100}" r="11" fill="#c94f4f"/>
      <path d="M${cx-34},${f-200} Q${cx},${f-184} ${cx+34},${f-200} L${cx+30},${f-186} Q${cx},${f-170} ${cx-30},${f-186} Z" fill="${scarf}"/>
      <rect x="${cx+8}" y="${f-188}" width="15" height="58" rx="4" fill="${scarf}" transform="rotate(-8 ${cx+15} ${f-188})"/>
      <clipPath id="h${cx}"><ellipse cx="${cx}" cy="${hy}" rx="46" ry="58"/></clipPath>

      <ellipse cx="${cx}" cy="${hy}" rx="46" ry="58" fill="none" stroke="#fff" stroke-width="3"/>
      <g transform="rotate(${tilt} ${cx} ${hy-48})">

        <circle cx="${cx+54}" cy="${hy-104}" r="11" fill="#fff"/>

      ${Array.from({length:18},(_,k)=>{ const yy=G-250+k*14, half=(yy-(G-280))*0.39; return `<circle cx="${(tx+(r()*2-1)*half*.85).toFixed(0)}" cy="${yy}" r="4.5" fill="${["#ffd166","#ff5a5a","#fff"][k%3]}"/>`; }).join("")}

      <path d="M492,${G-66} q-6,-40 2,-74 q8,-14 16,0 q6,34 0,74 z" fill="#3e6b5c"/>
      <circle cx="500" cy="${G-150}" r="11" fill="#3e6b5c"/>

    </g>`;
  const hall = `<g fill="#b8574a"><rect x="150" y="${G-330}" width="56" height="330"/><path d="M146,${G-330} h64 l-32,-70 z" fill="#2f4f46"/><path d="M178,${G-400} v-34" stroke="#e8b04f" stroke-width="4"/><circle cx="178" cy="${G-438}" r="6" fill="#e8b04f"/>
      <rect x="166" y="${G-300}" width="24" height="34" rx="12" fill="#ffd77a"/><circle cx="178" cy="${G-220}" r="13" fill="#f6f1e1" stroke="#2b2b33"/></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tegning af Ove og Eva med nissehuer foran Neptunbrønden og de oplyste huse på Langtorvet en sneklar vinteraften">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1d33"/><stop offset="1" stop-color="#34557a"/></linearGradient>

    <text x="500" y="70" text-anchor="middle" font-family="Alegreya,Georgia,serif" font-style="italic" font-weight="800" font-size="44" fill="#ffd166">Wesołych Świąt!</text>
    ${hall}${houses}
    <path d="M0 118 Q125 150 250 118 T500 118 T750 118 T1000 118" stroke="#1a2230" stroke-width="2" fill="none"/>${bulbs}
    <rect y="${G}" width="${W}" height="${H-G}" fill="url(#plaza)"/>
    ${tree(890)}${neptune}
    ${person(330,"#9b2d20","#f3e6c8",IMG.eva,-8)}
    ${person(670,"#1f3a56","#c8102e",IMG.ove,10)}

}

let ROUTE = "";

}
function go(id, anchor){
  ROUTE = id; try{ history.replaceState(null,"", id?"#"+id:location.pathname); }catch(e){}
  render();
  if(anchor){ const el = document.getElementById(anchor); if(el){ el.scrollIntoView({block:"start"}); return; } }
  window.scrollTo(0,0);
  if(id==="gave" && !giftLocked() && !giftOpened()){ store.set("gdk-gave-aabnet", true); party(); }
}

/* Fyrværkeri og flag */
function party(){
  if(document.getElementById("party")) return;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const o = document.createElement("div"); o.id = "party"; o.setAttribute("role","dialog"); o.setAttribute("aria-label","Tillykke");
  o.innerHTML = `<canvas></canvas><div class="msg"><div class="flagrow">${DK_FLAG}${DK_FLAG}${DK_FLAG}</div><h2>Tillykke, ${esc(GIFT.to)}!</h2><p>Her er din fødselsdagsgave</p><button class="btn" id="party-close">Se gaven</button></div>`;
  document.body.appendChild(o);
  const close = () => { o.remove(); stop = true; };
  o.addEventListener("click", close);
  document.addEventListener("keydown", function k(e){ if(e.key==="Escape"){ close(); document.removeEventListener("keydown",k); } });
  setTimeout(()=>{ const b = document.getElementById("party-close"); if(b) b.focus(); }, 50);
  let stop = false;
  if(reduce) return;
  for(let i=0;i<34;i++){
    const f = document.createElement("div"); f.className = "flag";
    f.innerHTML = DK_FLAG;
    f.style.left = (Math.random()*100)+"vw";
    f.style.animationDuration = (4+Math.random()*4)+"s";
    f.style.animationDelay = (Math.random()*3)+"s";
    f.style.setProperty("--r", (Math.random()*720-360)+"deg");
    o.appendChild(f);
  }
  const c = o.querySelector("canvas"), x = c.getContext("2d");
  const fit = () => { c.width = innerWidth*devicePixelRatio; c.height = innerHeight*devicePixelRatio; x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); };
  fit(); addEventListener("resize", fit);
  const COLORS = ["#ffd166","#ff4d4d","#ffffff","#ff9f1c","#c8102e","#7bdff2"];
  const rockets = [], sparks = [];
  let t = 0;
  function launch(){ rockets.push({x:innerWidth*(.15+Math.random()*.7), y:innerHeight, vy:-(innerHeight/62)*(.8+Math.random()*.35), vx:(Math.random()-.5)*2, c:COLORS[Math.random()*COLORS.length|0]}); }
  function burst(r){ const n = 70+Math.random()*40|0; for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = 1.5+Math.random()*4.5;
    sparks.push({x:r.x, y:r.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:60+Math.random()*40, c:Math.random()<.7?r.c:COLORS[Math.random()*COLORS.length|0]}); } }
  (function frame(){
    if(stop) return;
    t++;
    x.globalCompositeOperation = "destination-out"; x.fillStyle = "rgba(0,0,0,.22)"; x.fillRect(0,0,innerWidth,innerHeight);
    x.globalCompositeOperation = "lighter";
    if(t<480 && t%18===0) launch();
    if(t%90===0 && t<480){ launch(); launch(); }
    for(let i=rockets.length-1;i>=0;i--){ const r = rockets[i]; r.x+=r.vx; r.y+=r.vy; r.vy+=.18;
      x.fillStyle = r.c; x.beginPath(); x.arc(r.x,r.y,2.5,0,7); x.fill();
      if(r.vy>=-1){ burst(r); rockets.splice(i,1); } }
    for(let i=sparks.length-1;i>=0;i--){ const s = sparks[i]; s.x+=s.vx; s.y+=s.vy; s.vy+=.06; s.vx*=.985; s.vy*=.985; s.life--;
      x.globalAlpha = Math.max(0, Math.min(1, s.life/40)); x.fillStyle = s.c; x.beginPath(); x.arc(s.x,s.y,2,0,7); x.fill();
      if(s.life<=0) sparks.splice(i,1); }
    x.globalAlpha = 1;
    if(t<720 || sparks.length) requestAnimationFrame(frame);
  })();
}

/* events */
document.addEventListener("click",e=>{
  const g = e.target.closest("[data-go]");
  if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const j = e.target.closest("[data-jump]");
  if(j){ e.preventDefault(); const el = document.getElementById(j.dataset.jump); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(e.target.closest("[data-party]")){ party(); return; }
  const sg = e.target.closest("[data-sight]");
  if(sg){ SECTIONS.find(s=>s.id==="sevaerdigheder").filter = "alle"; go("sevaerdigheder", "s-"+sg.dataset.sight); return; }
  if(e.target.closest("a")) return;
  const pin = e.target.closest("[data-pin]");
  if(pin){ SELECTED = SELECTED===pin.dataset.pin ? "" : pin.dataset.pin; render(); const el=document.getElementById("pl-"+SELECTED); if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"}); return; }
  const sp = e.target.closest("[data-showpin]");
  if(sp){ SELECTED = sp.dataset.showpin; go("kort"); return; }
  const f = e.target.closest("[data-filter]");
  if(f){ SECTIONS.find(s=>s.id==="sevaerdigheder").filter = f.dataset.filter; render(); return; }
});
document.querySelector(".brand").addEventListener("click",e=>{ e.preventDefault(); go(""); });
document.addEventListener("keydown",e=>{ const p=e.target.closest&&e.target.closest("[data-pin]"); if(p&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); p.dispatchEvent(new MouseEvent("click",{bubbles:true})); } });
window.addEventListener("hashchange",()=>{ const h = location.hash.slice(1); if(SECTIONS.some(s=>s.id===h) || !h){ go(h); } });
const startHash = location.hash.slice(1);
ROUTE = SECTIONS.some(s=>s.id===startHash) ? startHash : "";
render();
if(ROUTE==="gave" && !giftLocked() && !giftOpened()){ store.set("gdk-gave-aabnet", true); party(); }
</script>
</body>
</html>
